<style>

/*jsPsych background color*/
  body {
background-color:#FFFFFF;
}

/*Padding for text*/
.custom_padding {
  padding-left: 4vw;
  padding-right: 4vw;
}

/*Indiviual video container*/
.video-container {
  object-fit: cover;
  width: 35vw;
  height: 100vh;
  display: block;
  margin: 0 auto;
  border-radius: 10px;
  overflow: hidden;
	}

.blur-fade-glow {
  opacity: 0.3;
  filter: blur(20px);
  animation: blurFadeGlow 10.5s ease-out forwards;
}

@keyframes blurFadeGlow {
  0% {
    opacity: 0.3;
    filter: blur(20px);
  }
  71.4% { /* 5s mark */
    opacity: 1;
    filter: blur(0px) drop-shadow(0 0 0px transparent);
  }
  85.7% { /* ~6s mark */
    filter: blur(0px) drop-shadow(0 0 20px #00FFFF) drop-shadow(0 0 40px #00FFFF) drop-shadow(0 0 60px #00BFFF);
  }
  100% {
    opacity: 1;
    filter: blur(0px) drop-shadow(0 0 0px transparent);
  }
}


</style>

<body>
</body>
<script>


//------------------------------------//
// Create Global Clock for Neuroimaging
//------------------------------------//
/* Create a variable to store the global clock */
let experimentClock = {
    start_time: null,
    trial_start_time: null
};

/* Function to initialize the global clock */
function initializeGlobalClock() {
    experimentClock.start_time = performance.now();
}

/* Function to get experiment start time */
function getExperimentStartTime() {
    return experimentClock.start_time;
}

/* Function to start timing a trial and return onset time */
function startTrialTiming() {
    experimentClock.trial_start_time = performance.now();
    const onset_time = experimentClock.trial_start_time - experimentClock.start_time;
    return onset_time;
}

/* Function to calculate the trial duration */
function getTrialDuration() {
    const duration = performance.now() - experimentClock.trial_start_time;
    return duration;
}

// /*Maybe useful to record when a participant takes a break or experimenter pauses the scan or in a trial with multiple video clips*/ 
// /* Function to get current time relative to experiment start */
// function getExperimentTime() {
//     return performance.now() - experimentClock.start_time;
// }



/* Declare global timing variables outside trial objects so that we can store data in the on_start() sections */
let exp_start_time_milliseconds = null;  // Only set once, never changes
let exp_start_time_seconds = null;  // Only set once, never changes

let trial_onset_time_milliseconds = null;       // Updated for each trial
let trial_onset_time_seconds = null;       // Updated for each trial



//------------------------------------//
// Establish Date
//------------------------------------//
var TODAY = new Date();
var DD = String(TODAY.getDate()).padStart(2, '0'); // this gets the date 
var MM = String(TODAY.getMonth() + 1).padStart(2, '0');  // this gets the month  
var YYYY = TODAY.getFullYear();  // this gets the year

const DATE = MM + DD + YYYY;
const fulldate = new Date().toLocaleString().replace(',','');



//------------------------------------//
// Initialize jsPsych
//------------------------------------//
function startExp() {}
var jsPsych = initJsPsych({
    on_finish: function() {
        var csv = jsPsych.data.get().csv();
        var filename = "PID_" + jsPsych.data.get().values()[0].PID + "_phase" + jsPsych.data.get().values()[0].phase + "_run" + jsPsych.data.get().values()[0].run + "_" + DATE + ".csv";
        downloadCSV(csv, filename);
        jsPsych.data.displayData()
    }
})




//------------------------------------//
// Initialize jsPsych Timeline
//------------------------------------//
var timeline = [];




//------------------------------------//
// TAG PROLIFIC DATA
//------------------------------------//
jsPsych.data.addProperties({
  script_name: "phase_2_run1_scnt_neuroimaging_30",
});




//------------------------------------//
// FULL SCREEN
//------------------------------------//
timeline.push({
    data: {
        trial_id: "full_screen"
    },
    type: jsPsychFullscreen,
    fullscreen_mode: true
});




//------------------------------------//
// PRELOAD STIMULI
//------------------------------------//
timeline.push(preload_aesthetics)
timeline.push(preload_intro_sound)



//------------------------------------//
// Enter PID
//------------------------------------//
// Modified enter_pid trial with dynamic stimuli loading
var enter_pid = {
    on_start: function() {

        document.body.style.backgroundColor = '#F0F0F0'
    },
    data: {
        startdate: fulldate,
        trial_id: "enter_pid"
    },
    type: jsPsychSurveyText,
    questions: [
        {
            prompt: "<p><div style ='font-size:3.5vw; margin-bottom: 12vh;'><b>Welcome to the experiment!</b></div></p>" +
                "<p><div style ='font-size:3.5vw; margin-bottom: 5vh;'>Enter participant ID</div></p>", 
            name: 'PID', 
            required: true
        },
        {
            prompt: "<p><div style ='font-size:3.5vw; margin-top: 10vh; margin-bottom: 5vh;'>Enter Phase #</div></p>", 
            placeholder: 'This is Phase 2', 
            name: 'phase', 
            required: true
        },
        {
            prompt: "<p><div style ='font-size:3.5vw; margin-top: 10vh; margin-bottom: 5vh;'>Enter Run #</div></p>", 
            placeholder: 'This is Run 1', 
            name: 'run', 
            required: true
        }
    ],
    css_classes: ['custom_padding'],
    on_finish: function(data) {
        var response = data.response;
        
        // Validate run number first
        var run_number = response.run.trim();
        if (run_number !== '1') {
            console.error('Invalid run number: ' + run_number);
            alert('Invalid run number. This script is for Run 1 only. Please enter 1.');
            jsPsych.abortExperiment('Invalid run number entered');
            return;
        }
        
        // Find the participant in the index
        var participant = participant_index.find(function(p) {
            return p.participant_ID === response.PID;
        });
        
        if (participant) {
            jsPsych.data.addProperties({
                PID: response.PID, 
                phase: response.phase,
                run: run_number,
                run_1_file: participant.run_1
            });
            
            console.log('Participant:', response.PID, '| Run:', run_number, '| File:', participant.run_1);
        } else {
            console.error('Participant ID not found: ' + response.PID);
            alert('Participant ID not found in the participant_index.js file. Please ensure you entered the correct participant ID.');
            jsPsych.abortExperiment('Invalid participant ID entered');
        }
    }
}



//----------------------------------------//
// Helper function to dynamically load stim
//----------------------------------------//
// Function to dynamically load JavaScript file with callback
function loadStimuliWithCallback(run1Path, callback) {
    var fullPath = '../scnt_master_stim/generated_stimuli/' + run1Path.replace('./', '');
    
    var script = document.createElement('script');
    script.src = fullPath;
    script.async = false;
    
    script.onload = function() {
        console.log('Stimuli loaded successfully');
        if (callback) callback(true);
    };
    
    script.onerror = function() {
        console.error('Failed to load stimuli file:', fullPath);
        alert('Failed to load stimuli file. The participant stimuli file may be misnamed or missing. Please check the file path.');
        if (callback) callback(false);
    };
    
    document.head.appendChild(script);
}



// =============================================================================
// LOADING SCREEN - This pauses the experiment while stimuli load
// =============================================================================
var loading_screen = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<p style="font-size: 3vw;">Loading session...</p>',
    choices: "NO_KEYS",
    trial_duration: null,
    data: {
        trial_id: "loading_screen"
    },
    on_start: function() {
        var last_trial = jsPsych.data.get().last(1).values()[0];
        var participant_id = last_trial.PID;
        var run_number = last_trial.run;
        
        console.log('Loading screen - Participant ID:', participant_id, '| Run:', run_number);
        
        // Find the participant in the index again to be safe
        var participant = participant_index.find(function(p) {
            return p.participant_ID === participant_id;
        });
        
        if (!participant) {
            console.error('Participant not found in loading screen');
            jsPsych.abortExperiment('Participant validation error');
            return;
        }
        
        // Verify run number and get correct file
        var run_file;
        if (run_number === '1') {
            run_file = participant.run_1;
        } else {
            console.error('Invalid run number in loading screen:', run_number);
            jsPsych.abortExperiment('Invalid run number');
            return;
        }
        
        console.log('Loading file:', run_file);
        
        loadStimuliWithCallback(run_file, function(success) {
            if (success) {
                console.log('Stimuli loaded - continuing experiment');
                setTimeout(function() {
                    jsPsych.finishTrial();
                }, 100);
            } else {
                console.error('Stimuli loading failed - aborting experiment');
                jsPsych.abortExperiment('Failed to load stimuli file');
            }
        });
    }
};




//------------------------------------//
// Audio Check Instructions
//------------------------------------//
var audio_check_instructions = {
  on_start: function() {
    document.body.style.backgroundColor = '#F0F0F0'
},
    data: {
        trial_id: "audio_check_instructions"
    },
    type: jsPsychInstructions,
    pages: function(){
    pageOne = "<p><div style ='font-size:3vw; line-height: 1.8em; margin-bottom: 4vh;'>Before we get started, we want to ensure your volume is set to a comfortable level.</div></p>" +
    "<p><div style ='font-size:3vw; line-height: 1.8em; margin-bottom: 4vh;'>In the next screen, you will hear a short audio sample.</div></p>" +
    "<p><div style ='font-size:3vw; line-height: 1.5em; margin-bottom: 6vh;'>We will adjust your volume to a comfortable level where you can clearly hear the sound.</div></p>" +
    "<p><div style ='font-size:3vw; margin-bottom: 4vh;'>Please press <b>Next</b> to hear the audio sample.</div></p>" 
    return [pageOne]
    },
    button_label_next: "Next",
    show_clickable_nav: true,
    css_classes: ['custom_padding'],
    }



//------------------------------------//
// Audio Check
//------------------------------------//
var audio_check = {
  on_start: function() {
        document.body.style.backgroundColor = '#000000'
  },
    data: {
        trial_id: "audio_check"
    },
    type: jsPsychHtmlButtonResponse,
    stimulus: function(){
                var html = 
                '<video disableRemotePlayback autoplay id="stimulus-video" src="study_design_aesthetics/audio_waveform_veed.mp4" <div style = "margin: 0"></video>' 
                return html;
            },  
    choices: ["<p style ='font-size: 1.8vw; color: black; position:fixed; left: 47.7vw; bottom: 3.3vh;'><b>Next</b></p>"],
    button_html: (choice) => {
      return `<button class="jspsych-btn" style="width: 7vw; height: 7vh; position: fixed; left: 46vw; bottom: 4vh;">${choice}</button>`
      },
    // button_html: ['<button class="jspsych-btn" style="width: 7vw; height: 7vh; position: fixed; left: 46.4vw; bottom: 4vh;" >%choice%</button>'],
    on_finish: function() {
        document.body.style.backgroundColor = '#F0F0F0'
    }
    }


//------------------------------------//
// Organize intro procedure
//------------------------------------//
var intro_procedure = {
    timeline: [enter_pid, loading_screen, preload_all_algorithm_icons, preload_run1_practice, preload_batch_one, preload_batch_two, preload_batch_three, audio_check_instructions, audio_check],
}



//------------------------------------//
// CONCATENATE TIMELINES
//------------------------------------//
timeline = timeline.concat(intro_procedure); // Intro procedure
timeline = timeline.concat(conceptual_novelty_task_run1); // conceptual novelty task -- RUN 1





//------------------------------------//
// Run the experiment
//------------------------------------//
jsPsych.run(timeline);


  </script>
</html>
